<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Student Notes Portal</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="auth-wrapper">
        <div class="card" id="login-section">
            <h2>Student Portal</h2>
            
            <!-- New Email & Password Form -->
            <form id="email-auth-form">
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="auth-email" class="form-control" required>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="auth-password" class="form-control" required>
                </div>
                <button type="submit" class="btn" id="btn-email-login">Login with Email</button>
                <button type="button" class="btn btn-secondary" id="btn-email-signup" style="margin-top: 10px;">Sign Up with Email</button>
            </form>

            <div style="text-align: center; margin: 1.5rem 0; color: var(--text-muted);">OR</div>

            <!-- Existing Google Login -->
            <button class="btn" id="btn-login" style="background-color: #db4437;">Sign in with Google</button>
        </div>

        <div class="card hidden" id="profile-section">
            <h2>Complete Profile</h2>
            <form id="profile-form">
                <!-- NEW: Profile Picture Input -->
                <div class="form-group">
                    <label>Profile Picture</label>
                    <input type="file" id="p-pic" class="form-control" accept="image/*" required>
                </div>

                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" id="p-name" class="form-control" required>
                </div>
                <div class="form-group">
                    <label>Age</label>
                    <input type="number" id="p-age" class="form-control" required>
                </div>
                <div class="form-group">
                    <label>Course</label>
                    <select id="p-course" class="form-control" required>
                        <option value="BBA">BBA</option>
                        <option value="BCA">BCA</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Section</label>
                    <input type="text" id="p-section" class="form-control" required>
                </div>
                <div class="form-group">
                    <label>Roll Number</label>
                    <input type="text" id="p-roll" class="form-control" required>
                </div>
                <button type="submit" class="btn">Save Profile</button>
            </form>
        </div>
    </div>
    
    <script type="module" src="app.js"></script>
</body>
</html>
